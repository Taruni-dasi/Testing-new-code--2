<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Джапа-медитация</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ff9933">
    <style>
        :root { --primary-color: #ff9933; --primary-hover: #e68a00; --bg-color: #fdfbf7; --card-bg: #ffffff; --text-color: #333333; --text-secondary: #666666; --border-radius: 16px; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #fdfbf7 0%, #f4e4c1 100%); color: var(--text-color); margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; transition: background-color 0.3s ease; }
        .container { background-color: var(--card-bg); border-radius: var(--border-radius); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); padding: 30px; max-width: 600px; width: 100%; text-align: center; transition: all 0.3s ease; }
        h1 { color: var(--primary-color); margin-bottom: 25px; font-size: 28px; font-weight: 600; margin-top: 0; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-secondary); }
        select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; background-color: #fff; cursor: pointer; transition: border-color 0.3s; box-sizing: border-box; }
        select:focus { outline: none; border-color: var(--primary-color); }
        .audio-controls { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 20px; }
        .buttons-row { display: flex; gap: 15px; justify-content: center; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 12px 24px; border-radius: 50px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.3s, transform 0.1s; display: flex; align-items: center; gap: 8px; }
        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.95); }
        button.secondary { background-color: #e0e0e0; color: #333; }
        button.secondary:hover { background-color: #d0d0d0; }
        .volume-control { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 250px; }
        input[type="range"] { flex-grow: 1; accent-color: var(--primary-color); cursor: pointer; }
        .slider-container { position: relative; margin: 10px 0; }
        .image-wrapper { position: relative; width: 100%; aspect-ratio: 4/3; background-color: #f0f0f0; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; touch-action: manipulation; cursor: pointer; }
        .slide-image { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.3s ease; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(255, 255, 255, 0.85); color: var(--primary-color); border: 1px solid rgba(0,0,0,0.05); width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: background-color 0.3s, transform 0.1s, opacity 0.3s; padding: 0; z-index: 10; }
        .slider-btn:hover { background-color: white; transform: translateY(-50%) scale(1.05); }
        .slider-btn:active { transform: translateY(-50%) scale(0.95); }
        .prev-btn { left: 12px; }
        .next-btn { right: 12px; }
        .description { margin-top: 20px; padding: 15px 20px; background-color: #f9f9f9; border-radius: 12px; text-align: left; border-left: 4px solid var(--primary-color); }
        .desc-ru { font-size: 16px; color: var(--text-color); margin-bottom: 8px; line-height: 1.5; font-weight: 500; }
        .desc-en { font-size: 14px; color: var(--text-secondary); font-style: italic; min-height: 20px; }
        .status-text { font-size: 14px; color: var(--text-secondary); margin-top: 10px; min-height: 20px; }
        body.fullscreen-mode { background-color: #000000; padding: 0; margin: 0; overflow: hidden; }
        body.fullscreen-mode .container { max-width: 100%; width: 100vw; height: 100vh; padding: 0; margin: 0; border-radius: 0; box-shadow: none; background: transparent; display: flex; flex-direction: column; }
        body.fullscreen-mode h1, body.fullscreen-mode .section:last-child, body.fullscreen-mode .description, body.fullscreen-mode label { display: none !important; }
        body.fullscreen-mode .section:first-child { margin: 0; padding: 0; border: none; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; }
        body.fullscreen-mode .slider-container { margin: 0; width: 100vw; height: 100vh; position: relative; }
        body.fullscreen-mode .image-wrapper { width: 100vw; height: 100vh; border-radius: 0; background-color: #000; aspect-ratio: unset; }
        body.fullscreen-mode .slide-image { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; object-fit: contain; }
        body.fullscreen-mode .slider-btn { width: 60px; height: 60px; font-size: 28px; opacity: 0.5; }
        body.fullscreen-mode .slider-btn:hover, body.fullscreen-mode .slider-btn:active { opacity: 1; }
        body.fullscreen-mode .prev-btn { left: 10px; }
        body.fullscreen-mode .next-btn { right: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🕉 Джапа-медитация</h1>
    <div class="section">
        <label>Образ для медитации и молитвы</label>
        <div class="slider-container">
            <div class="image-wrapper" id="imageWrapper">
                <button class="slider-btn prev-btn" id="prevBtn" aria-label="Предыдущее изображение">❮</button>
                <img src="" alt="Meditation Image" class="slide-image" id="slideImage">
                <button class="slider-btn next-btn" id="nextBtn" aria-label="Следующее изображение">❯</button>
            </div>
        </div>
        <div class="description">
            <div class="desc-ru" id="descRu"></div>
            <div class="desc-en" id="descEn"></div>
        </div>
    </div>
    <div class="section">
        <label for="mantraSelect">Выберите мантру для повторения:</label>
        <select id="mantraSelect">
            <option value="">-- Нажмите для выбора --</option>
        </select>
        <div class="status-text" id="statusText">Мантра не выбрана</div>
        <div class="audio-controls">
            <div class="buttons-row">
                <button id="playPauseBtn" disabled>▶ Играть</button>
                <button id="stopBtn" class="secondary" disabled>⏹ Стоп</button>
            </div>
            <div class="volume-control">
                <span>🔈</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" disabled>
                <span>🔊</span>
            </div>
        </div>
        <audio id="audioPlayer"></audio>
    </div>
</div>
<script>
    const BASE_URL = "assets/";
    const mantras = [
        { name: "Шрила Гурудев (с флейтой)", file: "audio/01_Srila-Gurudev-japa108-flute.mp3" },
        { name: "Шрила Гурудев", file: "audio/01_Srila-Gurudev-japa108.mp3" },
        { name: "Шрила Прабхупада", file: "audio/02-Srila-Prabhupada-japa108.mp3" },
        { name: "Прабхуджи (тихий)", file: "audio/03_Prabhuji-japa108-quiet.mp3" }
    ];
    const slides = [
        { image: "images/01_gurudev_smiling.jpg", descRu: "Шрила Гурудев улыбается, даря благословения преданным.", descEn: "" },
        { image: "images/01_gurudev.jpg", descRu: "Шрила Гурудев в медитации и молитве.", descEn: "" },
        { image: "images/01_rupa_sanatana_math_vrinda.jpg", descRu: "Божество Вринда Деви в Шри Рупа-Санатана Матхе во Вриндаване.", descEn: "" },
        { image: "images/04_swami_prabhupada_deities.png", descRu: "Божества Шрилы Прабхупады.", descEn: "" },
        { image: "images/05_bhakti_pragyana_keshava_murti_radhe_kunj.jpg", descRu: "Бхакти Прагьяна Кешава Махарадж (мурти) в Радхе Кунде.", descEn: "" }
    ];
    let currentSlideIndex = 0;
    const mantraSelect = document.getElementById('mantraSelect');
    const audioPlayer = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const statusText = document.getElementById('statusText');
    const slideImage = document.getElementById('slideImage');
    const descRu = document.getElementById('descRu');
    const descEn = document.getElementById('descEn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const imageWrapper = document.getElementById('imageWrapper');
    function init() {
        mantraSelect.innerHTML = '<option value="">-- Нажмите для выбора --</option>';
        mantras.forEach(function(mantra) {
            var option = document.createElement('option');
            option.value = mantra.file;
            option.textContent = mantra.name;
            mantraSelect.appendChild(option);
        });
        updateSlide();
    }
    mantraSelect.addEventListener('change', function() {
        var selectedFile = this.value;
        if (selectedFile === "") {
            statusText.textContent = "Мантра не выбрана";
            playPauseBtn.disabled = true; stopBtn.disabled = true; volumeSlider.disabled = true; audioPlayer.src = ""; return;
        }
        audioPlayer.src = BASE_URL + selectedFile;
        audioPlayer.load();
        var selectedOption = this.options[this.selectedIndex];
        statusText.textContent = "Готово к воспроизведению: " + selectedOption.textContent;
        playPauseBtn.disabled = false; stopBtn.disabled = false; volumeSlider.disabled = false;
        playPauseBtn.innerHTML = "▶ Играть";
    });
    playPauseBtn.addEventListener('click', function() {
        if (audioPlayer.paused) {
            audioPlayer.play().then(function() { playPauseBtn.innerHTML = "⏸ Пауза"; statusText.textContent = "Воспроизведение..."; }).catch(function(error) { console.error("Ошибка:", error); statusText.textContent = "Ошибка воспроизведения."; });
        } else { audioPlayer.pause(); playPauseBtn.innerHTML = "▶ Играть"; statusText.textContent = "На паузе"; }
    });
    stopBtn.addEventListener('click', function() { audioPlayer.pause(); audioPlayer.currentTime = 0; playPauseBtn.innerHTML = "▶ Играть"; statusText.textContent = "Остановлено"; });
    volumeSlider.addEventListener('input', function() { audioPlayer.volume = this.value; });
    audioPlayer.addEventListener('ended', function() { audioPlayer.currentTime = 0; audioPlayer.play(); });
    function updateSlide() {
        var slide = slides[currentSlideIndex];
        slideImage.src = BASE_URL + slide.image;
        descRu.textContent = slide.descRu; descEn.textContent = slide.descEn || " ";
        slideImage.style.opacity = 0;
        setTimeout(function() { slideImage.style.opacity = 1; }, 50);
    }
    prevBtn.addEventListener('click', function() { currentSlideIndex = (currentSlideIndex === 0) ? slides.length - 1 : currentSlideIndex - 1; updateSlide(); });
    nextBtn.addEventListener('click', function() { currentSlideIndex = (currentSlideIndex === slides.length - 1) ? 0 : currentSlideIndex + 1; updateSlide(); });
    imageWrapper.addEventListener('click', function(event) { if (event.target.closest('.slider-btn')) { return; } document.body.classList.toggle('fullscreen-mode'); });
    init();
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').then(function(reg) {
                console.log('SW registered:', reg.scope);
            }).catch(function(err) { console.log('SW error:', err); });
        });
    }
</script>
</body>
</html>
